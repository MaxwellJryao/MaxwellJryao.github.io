<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery · Jiarui Yao</title>
    <link rel="icon" href="assets/favicon1.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/enhancements.js" defer></script>
    <script src="js/gallery-page.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <div id="theme-switcher-container">
        <button id="themeToggleBtn" class="theme-toggle-btn">
            🌓
            <span class="auto-label">auto</span>
        </button>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <p class="gallery-back">
                <a href="index.html#gallery"><i class="fas fa-arrow-left"></i> Back to homepage</a>
            </p>
            <h1 class="name darkmode-ignore">Gallery</h1>
            <p class="title">A few moments worth keeping.</p>
        </header>

        <!-- All photos -->
        <section class="section" id="gallery-all">
            <div id="gallery-grid-container">
                <p>Loading gallery...</p>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; <span id="currentYear"></span> Jiarui Yao. All rights reserved.</p>
        </footer>
    </div>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
