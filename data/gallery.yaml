# Photo gallery (carousel + detail page)
# Each entry becomes a slide in the carousel and a tile on gallery.html;
# click it to open the full-size lightbox.
#
# Fields:
#   src     (required) full-resolution image, shown in the lightbox
#   thumb   (optional) low-res image for fast thumbnail loading in the
#           carousel/grid; falls back to `src` if omitted
#   caption (optional) short text shown over the photo and in the lightbox
#   alt     (optional) accessibility text (defaults to caption / filename)
#
# Tip: generate a thumbnail (e.g. ~800px JPEG) for each photo so the gallery
# loads fast, while the lightbox still shows the crisp original.
#
# NOTE: The images below are AI-generated placeholders. Replace them with your
# own photos by dropping files into assets/gallery/ and editing the entries.

